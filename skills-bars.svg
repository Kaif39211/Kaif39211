<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Skill levels: Excel, Power BI, SQL, Python">
  <title>Skill levels - Excel, Power BI, SQL, Python</title>

  <defs>
    <clipPath id="card"><rect width="900" height="270" rx="14"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1b26"/>
    </linearGradient>

    <linearGradient id="gExcel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f6b3f"/><stop offset="1" stop-color="#21d07a"/>
    </linearGradient>
    <linearGradient id="gBI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7308"/><stop offset="1" stop-color="#f2c811"/>
    </linearGradient>
    <linearGradient id="gSQL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a5a14"/><stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="gPy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4f94"/><stop offset="1" stop-color="#4b9fff"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00ff66"/>
      <stop offset="1" stop-color="#00b3ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1b2430"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="270" fill="url(#bg)"/>
    <rect width="900" height="270" fill="url(#dots)"/>

    <text x="40" y="36" font-size="12" letter-spacing="2" fill="#8b949e">SKILL LEVELS</text>
    <circle class="live" cx="824" cy="32" r="4" fill="#00ff66"/>
    <text x="860" y="36" font-size="11" text-anchor="end" fill="#8b949e">LIVE</text>

    <!-- axis grid -->
    <g stroke="#21262d" stroke-dasharray="3 4">
      <line x1="150" y1="58" x2="150" y2="224"/>
      <line x1="310" y1="58" x2="310" y2="224"/>
      <line x1="470" y1="58" x2="470" y2="224"/>
      <line x1="630" y1="58" x2="630" y2="224"/>
      <line x1="790" y1="58" x2="790" y2="224"/>
    </g>
    <g font-size="10" fill="#6e7681" text-anchor="middle">
      <text x="150" y="242">0</text>
      <text x="310" y="242">25</text>
      <text x="470" y="242">50</text>
      <text x="630" y="242">75</text>
      <text x="790" y="242">100</text>
    </g>

    <!-- ===== Row 1 : Excel 90% (fill width 576) ===== -->
    <text x="40" y="85" font-size="16" font-weight="700" fill="#21d07a">Excel</text>
    <rect x="150" y="73" width="640" height="14" rx="7" fill="#21262d"/>
    <rect x="150" y="73" width="0" height="14" rx="7" fill="url(#gExcel)">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="0;0;576;576;0" keyTimes="0;0.05;0.22;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </rect>
    <circle cx="150" cy="80" r="6" fill="#21d07a" filter="url(#glow)">
      <animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="150;150;726;726;150" keyTimes="0;0.05;0.22;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </circle>
    <text x="810" y="85" font-size="15" font-weight="700" fill="#21d07a" opacity="0">90%
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.22;0.28;0.9;1"/>
    </text>

    <!-- ===== Row 2 : Power BI 85% (fill width 544) ===== -->
    <text x="40" y="127" font-size="16" font-weight="700" fill="#f2c811">Power BI</text>
    <rect x="150" y="115" width="640" height="14" rx="7" fill="#21262d"/>
    <rect x="150" y="115" width="0" height="14" rx="7" fill="url(#gBI)">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="0;0;544;544;0" keyTimes="0;0.09;0.26;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </rect>
    <circle cx="150" cy="122" r="6" fill="#f2c811" filter="url(#glow)">
      <animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="150;150;694;694;150" keyTimes="0;0.09;0.26;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </circle>
    <text x="810" y="127" font-size="15" font-weight="700" fill="#f2c811" opacity="0">85%
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.26;0.32;0.9;1"/>
    </text>

    <!-- ===== Row 3 : SQL 80% (fill width 512) ===== -->
    <text x="40" y="169" font-size="16" font-weight="700" fill="#ff9f43">SQL</text>
    <rect x="150" y="157" width="640" height="14" rx="7" fill="#21262d"/>
    <rect x="150" y="157" width="0" height="14" rx="7" fill="url(#gSQL)">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="0;0;512;512;0" keyTimes="0;0.13;0.30;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </rect>
    <circle cx="150" cy="164" r="6" fill="#ff9f43" filter="url(#glow)">
      <animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="150;150;662;662;150" keyTimes="0;0.13;0.30;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </circle>
    <text x="810" y="169" font-size="15" font-weight="700" fill="#ff9f43" opacity="0">80%
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.30;0.36;0.9;1"/>
    </text>

    <!-- ===== Row 4 : Python 75% (fill width 480) ===== -->
    <text x="40" y="211" font-size="16" font-weight="700" fill="#4b9fff">Python</text>
    <rect x="150" y="199" width="640" height="14" rx="7" fill="#21262d"/>
    <rect x="150" y="199" width="0" height="14" rx="7" fill="url(#gPy)">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="0;0;480;480;0" keyTimes="0;0.17;0.34;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </rect>
    <circle cx="150" cy="206" r="6" fill="#4b9fff" filter="url(#glow)">
      <animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="spline"
        values="150;150;630;630;150" keyTimes="0;0.17;0.34;0.9;1"
        keySplines="0 0 1 1;0.22 0.8 0.3 1;0 0 1 1;0.5 0 1 1"/>
    </circle>
    <text x="810" y="211" font-size="15" font-weight="700" fill="#4b9fff" opacity="0">75%
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.34;0.40;0.9;1"/>
    </text>

    <rect x="0" y="265" width="900" height="5" fill="url(#flow)"/>
  </g>
</svg>
