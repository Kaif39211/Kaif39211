    <!-- centre panel -->
    <rect class="border" x="170" y="50" width="560" height="140" rx="12" fill="#050a0e" fill-opacity="0.9" stroke="#00ff66" stroke-width="1.5"/>
    <text x="450" y="78" font-size="12" letter-spacing="4" text-anchor="middle" fill="#8b949e">[ DATA ANALYST ]</text>
    <text x="450" y="124" font-size="38" font-weight="700" text-anchor="middle" fill="url(#nameGrad)" filter="url(#glow)">Kaif Mahaldar</text>
    <text x="450" y="150" font-size="15" text-anchor="middle" fill="#e6edf3">Transforming Data into Business Insights</text>
    <text x="450" y="174" font-size="14" font-weight="700" text-anchor="middle"><tspan fill="#21d07a">Excel</tspan><tspan fill="#6e7681"> | </tspan><tspan fill="#f2c811">Power BI</tspan><tspan fill="#6e7681"> | </tspan><tspan fill="#ff9f43">SQL</tspan><tspan fill="#6e7681"> | </tspan><tspan fill="#4b9fff">Python</tspan></text>

