<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Kaif Mahaldar - Data Analyst">
  <title>Kaif Mahaldar - Data Analyst</title>

  <defs>
    <clipPath id="card"><rect width="900" height="240" rx="14"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a0e"/>
      <stop offset="1" stop-color="#0a141c"/>
    </linearGradient>

    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#00ff66" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c8ffe0" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff66"/>
      <stop offset="1" stop-color="#00e0ff"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00ff66"/>
      <stop offset="1" stop-color="#00b3ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    .c { fill: url(#rain); font-size: 15px; animation: fall linear infinite; }
    @keyframes fall {
      from { transform: translateY(-210px); }
      to   { transform: translateY(255px); }
    }
    .border { animation: border 3s ease-in-out infinite; }
    @keyframes border { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: .85; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

